[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mrktcmp"
description = "Plotly/Dash webpage for comparing baskets of financial assets via backtesting"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "dash>=4.2",
    "plotly>=5.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "gunicorn>=21.2",
    "requests>=2.31",
    "pyarrow>=14.0",
    "dash-ag-grid>=35.0",
    "python-dotenv>=1.0",
    "dash-bootstrap-components>=1.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "pytest>=7.4",
    "flake8>=6.1",
    "pandas-stubs>=2.2",
]

[tool.setuptools]
packages = ["src", "src.callbacks", "src.strategies"]

[tool.setuptools_scm]
version_file = "src/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
